server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'
    pipeline_stages:
      # Parse logs JSON estruturados da aplicação Node.js
      - json:
          expressions:
            timestamp:
            level:
            message:
            correlation_id:
            service:
            module:
            method:
            route:
            status_code:
            duration_ms:
            user_id:
            error_stack:
      # Usa o timestamp do log como timestamp oficial (ISO 8601)
      - timestamp:
          source: timestamp
          format: RFC3339
      # Extrai level, service, module, method, route como labels
      # NOTA: correlation_id NÃO vai como label (alta cardinalidade = explosão de séries)
      - labels:
          level:
          service:
          module:
          method:
          route:
