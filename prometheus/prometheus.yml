global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Regras de alerta
rule_files:
  - '/etc/prometheus/alert-rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'node-app'
    static_configs:
      - targets: ['node_app:3001']
