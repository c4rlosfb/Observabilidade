name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint — ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

  docker-build:
    name: Docker — Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (app)
        run: docker compose build app

      - name: Validate docker-compose.yml
        run: docker compose config

  smoke-test:
    name: Test — Smoke Test
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start all services
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3001/ > /dev/null 2>&1; then
              echo "App is ready!"
              exit 0
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done
          echo "App failed to start"
          exit 1

      - name: Smoke test — Homepage (GET /)
        run: curl -sf -o /dev/null http://localhost:3001/

      - name: Smoke test — Metrics (GET /metrics)
        run: curl -sf -o /dev/null http://localhost:3001/metrics

      - name: Smoke test — Register (POST /register)
        run: |
          curl -sf -X POST http://localhost:3001/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke-test","password":"test123"}'

      - name: Smoke test — Login (POST /login)
        run: |
          curl -sf -X POST http://localhost:3001/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"smoke-test","password":"test123"}'

      - name: Smoke test — List users (GET /users)
        run: curl -sf http://localhost:3001/users

      - name: Cleanup
        run: docker compose down -v
